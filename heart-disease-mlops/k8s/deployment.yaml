# Deployment (Etapa 4): le dice a Kubernetes qué contenedor correr y cuántas copias mantener vivas.
# Si el contenedor se cae, Kubernetes lo vuelve a crear automáticamente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-model
  template:
    metadata:
      labels:
        app: heart-model
    spec:
      containers:
        - name: model
          # Imagen construida localmente y cargada en Minikube con: minikube image load heart-api:1.0
          # Para usar Docker Hub, cambiar por <TU_USUARIO_DOCKER>/heart-api:1.0 y quitar imagePullPolicy
          image: heart-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Kubernetes solo envía tráfico al pod cuando /health responde (el modelo ya cargó)
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          # Si /health deja de responder, Kubernetes reinicia el contenedor
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
